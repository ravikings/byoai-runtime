name: Build distribution

on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install build twine
      - run: python -m build
      # Catches metadata problems (bad readme rendering, missing fields)
      # before an artifact can reach PyPI.
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: ${{ inputs.retention-days }}
