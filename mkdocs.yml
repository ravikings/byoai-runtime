site_name: ByoAI Runtime
site_description: The AI execution runtime for Python. Bring your own infrastructure; ByoAI brings the runtime.
site_url: https://ravikings.github.io/byoai-runtime/
repo_url: https://github.com/ravikings/byoai-runtime
repo_name: ravikings/byoai-runtime
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
      - FastAPI integration: guides/fastapi.md
      - Robyn integration: guides/robyn.md
      - Caching: guides/caching.md
      - Vector stores & filters: guides/vector-stores.md
      - Provider routing & fallback: guides/providers.md
      - Background workers: guides/workers.md
  - API Reference: reference/api.md
  - Changelog: https://github.com/ravikings/byoai-runtime/blob/main/CHANGELOG.md
  - Contributing: https://github.com/ravikings/byoai-runtime/blob/main/CONTRIBUTING.md
