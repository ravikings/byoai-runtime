[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "byoai-runtime"
dynamic = ["version"]
description = "The AI execution runtime for Python. Bring your own infrastructure; ByoAI brings the runtime."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "ByoAI Runtime Contributors" }]
keywords = ["ai", "llm", "runtime", "pipeline", "fastapi", "rag", "openai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
]
dependencies = [
    "httpx>=0.25",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100", "sse-starlette>=1.6"]
agent-context-cache = ["fastapi>=0.100", "uvicorn>=0.30", "redis>=5.0"]
robyn = ["robyn>=0.60"]
mcp = ["mcp>=1.0"]
flask = ["flask>=3.0"]
perf = ["orjson>=3.9"]
semantic = ["numpy>=1.24"]
redis = ["redis>=5.0"]
pgvector = ["asyncpg>=0.29"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp>=1.20"]
bedrock = ["anthropic[bedrock]>=0.40"]
vertex = ["anthropic[vertex]>=0.40"]
all = ["byoai-runtime[fastapi,robyn,mcp,flask,perf,semantic,redis,pgvector,otel,bedrock,vertex,agent-context-cache]"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1",
    "build>=1.2",
]

[project.scripts]
byoai-agent-context-cache = "byoai.agent_context_cache.main:run"

[project.urls]
Homepage = "https://github.com/ravikings/byoai-runtime"
Repository = "https://github.com/ravikings/byoai-runtime"
Documentation = "https://ravikings.github.io/byoai-runtime/"
Changelog = "https://github.com/ravikings/byoai-runtime/blob/main/CHANGELOG.md"
Issues = "https://github.com/ravikings/byoai-runtime/issues"

[tool.hatch.version]
path = "src/byoai/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/byoai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# importlib import mode + explicit pythonpath so the local `tests` package
# wins over any stray `tests` dist installed in site-packages (which otherwise
# shadows `tests.conftest` and breaks collection).
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: `Depends(...)` in argument defaults is the standard FastAPI idiom.
ignore = ["B008"]
