name: CI

# Tag-only, to keep CI spend proportional to releases rather than to commits.
#
# The trade this makes: nothing validates a push or a pull request any more, so
# main can carry a lint error, a type error or a failing test until the next tag
# exposes it — and at that point the failure blocks a release instead of a
# merge. `workflow_dispatch` is kept so the full suite can still be run by hand
# from the Actions tab before tagging, which is the cheapest way to avoid
# discovering a break at release time.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, type-check & docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[all,dev,docs]"
      - run: ruff check .
      - run: pyright
      # Catches broken nav/links/mkdocstrings refs at PR time — docs.yml only
      # runs on push to main, which is too late to stop a bad deploy.
      - run: mkdocs build --strict

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -e ".[all,dev]"
      - run: python -m pytest -v --cov=byoai --cov-report=term-missing

  build:
    name: Build distribution
    needs: [lint, test]
    uses: ./.github/workflows/build.yml
